name: ESP-IDF build

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ESP32-C3 BLE test firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware and merged image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32c3
          command: idf.py build && cp build/esp32_platform_ble_test.bin build/esp32_platform_ble_test-ota.bin && idf.py merge-bin -o esp32_platform_ble_test-full.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-platform-ble-${{ github.ref_name }}-${{ github.sha }}
          path: |
            build/esp32_platform_ble_test-ota.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/esp32_platform_ble_test-full.bin
          if-no-files-found: error
          retention-days: 14

      - name: Publish firmware to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/esp32_platform_ble_test-ota.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/esp32_platform_ble_test-full.bin
